name: Build unsigned iPhone IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Sync bundled offline app
        run: npm run sync:ios
      - name: Validate source package
        run: npm run check
      - name: Compile device app and package unsigned IPA
        run: bash scripts/build-unsigned-ipa.sh
      - name: Downloadable IPA for local re-signing
        uses: actions/upload-artifact@v7
        with:
          name: ShanghaiMetro-unsigned-IPA
          path: build/ShanghaiMetro-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
